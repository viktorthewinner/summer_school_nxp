<text x="740" y="1002" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333333">COMMON GROUND &#8212; ALL FOUR BOARDS</text>
<rect x="60" y="1050" width="1300" height="176" rx="6" fill="#F7F9FC" stroke="#C3CEDC" stroke-width="1"/>
<rect x="60" y="1050" width="4" height="176" fill="#C7761B"/>
<text x="84" y="1076" font-size="13" font-weight="bold" fill="#12305B">Check before applying power</text>
<text x="84" y="1100" font-size="11.6" fill="#1B1B1B">1.  Every ground symbol is the same net as the GND rail.  Both R2 resistors and all four boards return to it.</text>
<text x="84" y="1119" font-size="11.6" fill="#1B1B1B">2.  TX and RX are CROSSED on both UART links.  An MCX TX pin always goes to an Arduino D4.  Never TX to TX.</text>
<text x="84" y="1138" font-size="11.6" fill="#1B1B1B">3.  BOTH Arduinos need their own 1 k&#8486; / 2 k&#8486; divider on D5.  The two MCX TX lines are plain wires.</text>
<text x="84" y="1157" font-size="11.6" fill="#1B1B1B">4.  I2C pull-ups go to 3.3 V ONLY.  Remove any 5 V pull-ups from I2C breakout boards first.</text>
<text x="84" y="1176" font-size="11.6" fill="#1B1B1B">5.  The 16&#215;2 LCD goes on Arduino 2 (5 V native), NOT on this I2C bus &#8212; its backpack pulls up to 5 V.</text>
<text x="84" y="1195" font-size="11.6" fill="#1B1B1B">6.  Each board on its own USB during bring-up.  Motors run from the AA pack, never from a 9 V PP3.</text>
<text x="84" y="1214" font-size="11.6" font-weight="bold" fill="#C0392B">7.  P3_14, P1_8 and EVERY ESP32 pin are NOT 5 V tolerant.  5 V on any of them destroys the chip.</text>
