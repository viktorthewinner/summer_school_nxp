<text x="725" y="786" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">COMMON GROUND &#8212; MANDATORY</text>
<rect x="50" y="838" width="1040" height="150" rx="6" fill="#F7F9FC" stroke="#C3CEDC" stroke-width="1"/>
<rect x="50" y="838" width="4" height="150" fill="#C7761B"/>
<text x="74" y="864" font-size="13" font-weight="bold" fill="#12305B">Check before applying power</text>
<text x="74" y="888" font-size="11.8" fill="#1B1B1B">1.  Every ground symbol is the same net as the GND wire.  Both R2 resistors return to it.</text>
<text x="74" y="908" font-size="11.8" fill="#1B1B1B">2.  TX and RX are CROSSED on both links.  An MCX TX pin always goes to an Arduino D4.  Never TX to TX.</text>
<text x="74" y="928" font-size="11.8" fill="#1B1B1B">3.  BOTH Arduinos need their own 1 k&#8486; / 2 k&#8486; divider on D5.  The two MCX TX lines are plain wires.</text>
<text x="74" y="948" font-size="11.8" fill="#1B1B1B">4.  Both sketches are IDENTICAL.  A node's identity comes from which MCX port it is wired to.</text>
<text x="74" y="968" font-size="11.8" fill="#1B1B1B">5.  Do NOT connect 5 V or 3.3 V between boards.  Each board is powered by its own USB cable.</text>
<text x="74" y="988" font-size="11.8" font-weight="bold" fill="#C0392B">6.  P3_14 and P1_8 are NOT 5 V tolerant.  Wiring D5 to either one directly will damage the MCU.</text>
</svg>