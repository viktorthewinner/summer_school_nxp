<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1330" width="1760" height="1330" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B26B00"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B03A3E"/></marker>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#12305B"/></marker>
</defs>
<rect width="1760" height="1330" fill="#ffffff"/>
<text x="880.0" y="46" font-size="25" fill="#12305B" text-anchor="middle" font-weight="bold">Distributed ECU Car &#8212; Power and Grounding</text>
<text x="880.0" y="72" font-size="13" fill="#5A6472" text-anchor="middle">Two supplies, one star point &#8212; sheet 2 of 2.  Signals on SCHEMA_SIGNALS.svg</text>
<text x="880.0" y="92" font-size="11.5" fill="#B03A3E" text-anchor="middle" font-weight="bold">There is no regulator in your box, so logic runs from USB. That is the correct bring-up configuration anyway.</text>
<rect x="60" y="195" width="230" height="110" fill="#ffffff" stroke="#B03A3E" stroke-width="1.6" rx="5"/>
<rect x="60" y="195" width="5" height="110" fill="#B03A3E"/>
<text x="76" y="214" font-size="12.5" fill="#B03A3E" font-weight="bold">4 &#215; AA holder</text>
<text x="76" y="228" font-size="9.5" fill="#5A6472">6.0 V alkaline &#183; 4.8 V NiMH</text>
<text x="76" y="262" font-size="9" fill="#5A6472">NiMH preferred &#8212; 4.8 V is inside</text>
<text x="76" y="276" font-size="9" fill="#5A6472">the MG90S 4.8&#8211;6.0 V window;</text>
<text x="76" y="290" font-size="9" fill="#B03A3E">fresh alkalines overshoot to 6.4 V.</text>
<polyline points="290,250 330,250" fill="none" stroke="#B03A3E" stroke-width="3" stroke-linejoin="round"/>
<line x1="330" y1="250" x2="1560" y2="250" stroke="#B03A3E" stroke-width="4"/>
<text x="1560" y="238" font-size="12" fill="#B03A3E" text-anchor="end" font-weight="bold">TRACTION RAIL  ~6 V</text>
<rect x="440" y="320" width="280" height="150" fill="#FDF4F4" stroke="#B03A3E" stroke-width="2.2" rx="6" stroke-dasharray="7 5"/>
<text x="580.0" y="344" font-size="15" fill="#B03A3E" text-anchor="middle" font-weight="bold">Dual H-bridge</text>
<text x="580.0" y="360" font-size="10.5" fill="#B03A3E" text-anchor="middle">L298N / TB6612FNG</text>
<rect x="506.0" y="370" width="148" height="17" fill="#B03A3E" rx="3"/>
<text x="580.0" y="382" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">NOT IN YOUR BOX</text>
<circle cx="580" cy="250" r="4" fill="#B03A3E"/>
<polyline points="580,250 580,320" fill="none" stroke="#B03A3E" stroke-width="3" stroke-linejoin="round"/>
<text x="454" y="438" font-size="9" fill="#B03A3E">VM &#8592; this rail &#183; VCC &#8592; ACT 5 V</text>
<text x="454" y="452" font-size="9" fill="#B03A3E">ENA/ENB + IN1&#8211;4 &#8592; ACT &#8212; see sheet 1</text>
<rect x="440" y="500" width="280" height="104" fill="#ffffff" stroke="#B03A3E" stroke-width="2.2" rx="6"/>
<rect x="440" y="500" width="280" height="40" fill="#B03A3E" rx="6"/>
<rect x="440" y="532" width="280" height="8" fill="#B03A3E"/>
<text x="580.0" y="520" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4 &#215; DC gear motor</text>
<text x="580.0" y="534" font-size="10.5" fill="#D6E0EC" text-anchor="middle">wired as a left pair and a right pair</text>
<polyline points="500,470 500,500" fill="none" stroke="#B03A3E" stroke-width="2.2" stroke-linejoin="round"/>
<polyline points="545,470 545,500" fill="none" stroke="#B03A3E" stroke-width="2.2" stroke-linejoin="round"/>
<polyline points="615,470 615,500" fill="none" stroke="#B03A3E" stroke-width="2.2" stroke-linejoin="round"/>
<polyline points="660,470 660,500" fill="none" stroke="#B03A3E" stroke-width="2.2" stroke-linejoin="round"/>
<text x="454" y="578" font-size="9" fill="#5A6472">Skid steer. 2 channels, 2 encoders.</text>
<rect x="880" y="320" width="280" height="130" fill="#ffffff" stroke="#B03A3E" stroke-width="2.2" rx="6"/>
<rect x="880" y="320" width="280" height="40" fill="#B03A3E" rx="6"/>
<rect x="880" y="352" width="280" height="8" fill="#B03A3E"/>
<text x="1020.0" y="340" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2 &#215; MG90S</text>
<text x="1020.0" y="354" font-size="10.5" fill="#D6E0EC" text-anchor="middle">pan / tilt for the scanning head</text>
<circle cx="1020" cy="250" r="4" fill="#B03A3E"/>
<polyline points="1020,250 1020,320" fill="none" stroke="#B03A3E" stroke-width="3" stroke-linejoin="round"/>
<text x="894" y="398" font-size="9.5" fill="#B03A3E" font-weight="bold">V+ from THIS rail, never from an</text>
<text x="894" y="412" font-size="9.5" fill="#B03A3E" font-weight="bold">Arduino 5 V pin &#8212; stall is ~700 mA</text>
<text x="894" y="430" font-size="9.5" fill="#5A6472">each. Signal from PERC D6 / D7.</text>
<rect x="1230" y="320" width="400" height="284" fill="#F4F7FA" stroke="#C3CEDC" stroke-width="1.2" rx="6"/>
<rect x="1230" y="320" width="4" height="284" fill="#12305B"/>
<text x="1248" y="345" font-size="13" fill="#12305B" font-weight="bold">WHY USB FOR THE LOGIC</text>
<text x="1248" y="367" font-size="10" fill="#5A6472">You have no buck converter and no regulator,</text>
<text x="1248" y="385" font-size="10" fill="#5A6472">so there is nothing in the box that can turn</text>
<text x="1248" y="403" font-size="10" fill="#5A6472">6 V into a clean 5 V logic rail.</text>
<text x="1248" y="421" font-size="10" fill="#5A6472"></text>
<text x="1248" y="439" font-size="10" fill="#5A6472">That is not a problem yet. Every board here has</text>
<text x="1248" y="457" font-size="10" fill="#5A6472">a USB port and its own on-board regulator, and</text>
<text x="1248" y="475" font-size="10" fill="#5A6472">you develop with all four plugged into the</text>
<text x="1248" y="493" font-size="10" fill="#5A6472">laptop anyway &#8212; you need the serial monitors.</text>
<text x="1248" y="511" font-size="10" fill="#5A6472"></text>
<text x="1248" y="529" font-size="10" fill="#5A6472">The motor pack powers motors and servos only.</text>
<text x="1248" y="547" font-size="10" fill="#5A6472">Tie its negative to the boards' ground and</text>
<text x="1248" y="565" font-size="10" fill="#5A6472">nothing else crosses between the two supplies.</text>
<text x="1248" y="583" font-size="10" fill="#5A6472"></text>
<text x="1248" y="601" font-size="10" fill="#5A6472">Untethered later: one 5 V USB power bank feeds</text>
<text x="1248" y="619" font-size="10" fill="#5A6472">all four boards, pack still feeds the motors.</text>
<rect x="60" y="735" width="230" height="110" fill="#ffffff" stroke="#B26B00" stroke-width="1.6" rx="5"/>
<rect x="60" y="735" width="5" height="110" fill="#B26B00"/>
<text x="76" y="754" font-size="12.5" fill="#B26B00" font-weight="bold">USB 5 V</text>
<text x="76" y="768" font-size="9.5" fill="#5A6472">laptop, or a power bank</text>
<text x="76" y="802" font-size="9" fill="#5A6472">4 ports during bring-up.</text>
<text x="76" y="816" font-size="9" fill="#5A6472">One bank + a hub on the car.</text>
<polyline points="290,790 330,790" fill="none" stroke="#B26B00" stroke-width="3" stroke-linejoin="round"/>
<line x1="330" y1="790" x2="1560" y2="790" stroke="#B26B00" stroke-width="4"/>
<text x="1560" y="778" font-size="12" fill="#B26B00" text-anchor="end" font-weight="bold">LOGIC  5 V (USB)</text>
<rect x="380" y="870" width="240" height="110" fill="#ffffff" stroke="#12305B" stroke-width="1.6" rx="5"/>
<rect x="380" y="870" width="5" height="110" fill="#12305B"/>
<text x="396" y="889" font-size="12.5" fill="#12305B" font-weight="bold"></text>
<text x="394" y="896" font-size="11.5" fill="#12305B" font-weight="bold">FRDM-MCXA153</text>
<text x="394" y="920" font-size="9" fill="#5A6472">MCU-Link USB</text>
<text x="394" y="934" font-size="9" fill="#5A6472">LDO_3V3 J3-8 &#8594; HW-123 + OV7670?</text>
<circle cx="500" cy="790" r="4" fill="#B26B00"/>
<polyline points="500,790 500,870" fill="none" stroke="#B26B00" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="500" y1="980" x2="500" y2="1040" stroke="#12305B" stroke-width="1.8"/>
<rect x="700" y="870" width="240" height="110" fill="#ffffff" stroke="#0B7A75" stroke-width="1.6" rx="5"/>
<rect x="700" y="870" width="5" height="110" fill="#0B7A75"/>
<text x="716" y="889" font-size="12.5" fill="#0B7A75" font-weight="bold"></text>
<text x="714" y="896" font-size="11.5" fill="#0B7A75" font-weight="bold">PERC &#8212; Arduino</text>
<text x="714" y="920" font-size="9" fill="#5A6472">USB &#183; CH340</text>
<text x="714" y="934" font-size="9" fill="#5A6472">+ HC-SR04P, matrix, SFM-27</text>
<circle cx="820" cy="790" r="4" fill="#B26B00"/>
<polyline points="820,790 820,870" fill="none" stroke="#B26B00" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="820" y1="980" x2="820" y2="1040" stroke="#12305B" stroke-width="1.8"/>
<rect x="1020" y="870" width="240" height="110" fill="#ffffff" stroke="#0B7A75" stroke-width="1.6" rx="5"/>
<rect x="1020" y="870" width="5" height="110" fill="#0B7A75"/>
<text x="1036" y="889" font-size="12.5" fill="#0B7A75" font-weight="bold"></text>
<text x="1034" y="896" font-size="11.5" fill="#0B7A75" font-weight="bold">ACT &#8212; Arduino</text>
<text x="1034" y="920" font-size="9" fill="#5A6472">USB &#183; CH340</text>
<text x="1034" y="934" font-size="9" fill="#5A6472">+ 7-seg, LCD, driver VCC</text>
<circle cx="1140" cy="790" r="4" fill="#B26B00"/>
<polyline points="1140,790 1140,870" fill="none" stroke="#B26B00" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="1140" y1="980" x2="1140" y2="1040" stroke="#12305B" stroke-width="1.8"/>
<rect x="1340" y="870" width="240" height="110" fill="#ffffff" stroke="#6B3FA0" stroke-width="1.6" rx="5"/>
<rect x="1340" y="870" width="5" height="110" fill="#6B3FA0"/>
<text x="1356" y="889" font-size="12.5" fill="#6B3FA0" font-weight="bold"></text>
<text x="1354" y="896" font-size="11.5" fill="#6B3FA0" font-weight="bold">ESP32</text>
<text x="1354" y="920" font-size="9" fill="#5A6472">USB</text>
<text x="1354" y="934" font-size="9" fill="#5A6472">+ OV7670 on its 3.3 V pin</text>
<circle cx="1460" cy="790" r="4" fill="#B26B00"/>
<polyline points="1460,790 1460,870" fill="none" stroke="#B26B00" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="1460" y1="980" x2="1460" y2="1040" stroke="#12305B" stroke-width="1.8"/>
<text x="1354" y="962" font-size="9" fill="#B03A3E">camera is ~60 mA &#8212; watch WiFi TX dips</text>
<line x1="580" y1="604" x2="580" y2="650" stroke="#12305B" stroke-width="1.8"/>
<line x1="1020" y1="450" x2="1020" y2="650" stroke="#12305B" stroke-width="1.8"/>
<line x1="580" y1="650" x2="1660" y2="650" stroke="#12305B" stroke-width="2.6"/>
<circle cx="580" cy="650" r="3.4" fill="#12305B"/>
<circle cx="1020" cy="650" r="3.4" fill="#12305B"/>
<text x="1650" y="640" font-size="9.5" fill="#12305B" text-anchor="end" font-weight="bold">TRACTION RETURN</text>
<polyline points="1660,650 1660,1040 1580,1040" fill="none" stroke="#12305B" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="155" y1="305" x2="155" y2="1040" stroke="#12305B" stroke-width="1.8"/>
<line x1="155" y1="845" x2="155" y2="1040" stroke="#12305B" stroke-width="1.8"/>
<line x1="60" y1="1040" x2="1660" y2="1040" stroke="#12305B" stroke-width="5"/>
<text x="60" y="1026" font-size="13" fill="#12305B" font-weight="bold">STAR GROUND &#8212; ONE POINT AT THE PACK NEGATIVE</text>
<text x="1580" y="1064" font-size="10" fill="#5A6472" text-anchor="end">The pack negative and the USB ground MUST be tied. Without it the motor driver sees no valid logic level and nothing works.</text>
<rect x="60" y="1090" width="1640" height="200" fill="#F4F7FA" stroke="#C3CEDC" stroke-width="1.2" rx="6"/>
<rect x="60" y="1090" width="4" height="200" fill="#12305B"/>
<text x="78" y="1115" font-size="13" fill="#12305B" font-weight="bold">POWER RULES</text>
<text x="82" y="1139" font-size="10.5" fill="#5A6472">1.  Tie the battery negative to the boards' ground. This is the one wire that has to cross</text>
<text x="82" y="1160" font-size="10.5" fill="#5A6472">     between the two supplies &#8212; and the one everybody forgets.</text>
<text x="82" y="1181" font-size="10.5" fill="#5A6472">2.  Never feed 6 V into an Arduino 5 V pin or into the MCX. The pack goes to the motor</text>
<text x="82" y="1202" font-size="10.5" fill="#5A6472">     driver's VM and the servos' V+, and nowhere else.</text>
<text x="82" y="1223" font-size="10.5" fill="#5A6472">3.  Servos and motors share the pack, and servos brown out when the motors start. If the</text>
<text x="82" y="1244" font-size="10.5" fill="#5A6472">     scanning head twitches on acceleration, that is why &#8212; a second pack fixes it.</text>
<text x="890" y="1139" font-size="10.5" fill="#5A6472">4.  Set the 8&#215;8 matrix intensity low. A MAX7219 at full brightness can pull 300 mA and</text>
<text x="890" y="1160" font-size="10.5" fill="#5A6472">      your USB port will not enjoy it.</text>
<text x="890" y="1181" font-size="10.5" fill="#5A6472">5.  The MG90S window is 4.8&#8211;6.0 V. Fresh alkalines sit at ~6.4 V. Use NiMH.</text>
<text x="890" y="1202" font-size="10.5" fill="#5A6472">6.  Wheels off the floor for every reset until 10 k&#8486; pull-downs are on ENA / ENB &#8212;</text>
<text x="890" y="1223" font-size="10.5" fill="#5A6472">      the driver's enable inputs float while the Arduino is in reset.</text>
<text x="890" y="1244" font-size="10.5" fill="#5A6472">7.  Unplug the OV7670 before flashing the ESP32: it hangs off GPIO0, a strapping pin.</text>
</svg>
