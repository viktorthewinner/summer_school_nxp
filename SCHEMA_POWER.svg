<text x="550" y="589" font-size="11" fill="#B26B00" text-anchor="middle" font-weight="bold">BUCK  9 V &#8594; 5.0 V</text>
<text x="550" y="601" font-size="8" fill="#B26B00" text-anchor="middle">MP1584 / LM2596 &#183; set it, measure it</text>
<polyline points="550,608 550,630" fill="none" stroke="#B26B00" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="550" y1="760" x2="550" y2="790" stroke="#12305B" stroke-width="1.6"/>
