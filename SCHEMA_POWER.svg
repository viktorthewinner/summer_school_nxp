<rect width="1760" height="1760" fill="#ffffff"/>
<text x="880.0" y="46" font-size="25" fill="#12305B" text-anchor="middle" font-weight="bold">Distributed ECU Car &#8212; Power and Grounding</text>
<text x="880.0" y="72" font-size="13" fill="#5A6472" text-anchor="middle">Three supplies, one star point &#8212; sheet 2 of 3.  Signals on SCHEMA_SIGNALS.svg, wiring on SCHEMA_WIRING.svg</text>
<text x="880.0" y="92" font-size="11.5" fill="#B03A3E" text-anchor="middle" font-weight="bold">Independent supplies are fine. What is NOT optional is that every negative meets at one point &#8212; that is the only thing that makes the links work.</text>
<rect x="60" y="170" width="230" height="110" fill="#ffffff" stroke="#B03A3E" stroke-width="1.6" rx="5"/>
<rect x="60" y="170" width="5" height="110" fill="#B03A3E"/>
