<text x="1100" y="543" font-size="12" fill="#6B3FA0" text-anchor="end" font-weight="bold">LOGIC  9 V</text>
<rect x="400" y="630" width="300" height="130" fill="#ffffff" stroke="#6B3FA0" stroke-width="2.2" rx="6"/>
<rect x="400" y="630" width="300" height="40" fill="#6B3FA0" rx="6"/>
<rect x="400" y="662" width="300" height="8" fill="#6B3FA0"/>
<text x="550.0" y="650" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">FRDM-MCXA153</text>
<text x="550.0" y="664" font-size="10.5" fill="#D6E0EC" text-anchor="middle">&#8594; J3-10  (SYS_5V0)  via BUCK</text>
