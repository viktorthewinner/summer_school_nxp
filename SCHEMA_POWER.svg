<rect x="760" y="630" width="300" height="40" fill="#6B3FA0" rx="6"/>
<rect x="760" y="662" width="300" height="8" fill="#6B3FA0"/>
<text x="910.0" y="650" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">ESP32</text>
<text x="910.0" y="664" font-size="10.5" fill="#D6E0EC" text-anchor="middle">&#8594; VIN, 9 V direct</text>
<circle cx="910" cy="555" r="4" fill="#6B3FA0"/>
<polyline points="910,555 910,630" fill="none" stroke="#6B3FA0" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="910" y1="760" x2="910" y2="790" stroke="#12305B" stroke-width="1.6"/>
<circle cx="910" cy="790" r="3.2" fill="#12305B"/>
<line x1="420" y1="790" x2="1190" y2="790" stroke="#12305B" stroke-width="2.2"/>
