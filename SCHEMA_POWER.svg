<rect x="60" y="830" width="230" height="110" fill="#ffffff" stroke="#B26B00" stroke-width="1.6" rx="5"/>
<rect x="60" y="830" width="5" height="110" fill="#B26B00"/>
<text x="76" y="849" font-size="12.5" fill="#B26B00" font-weight="bold">USB 5 V</text>
<text x="76" y="863" font-size="9.5" fill="#5A6472">laptop, or a power bank</text>
<polyline points="290,885 330,885" fill="none" stroke="#B26B00" stroke-width="3" stroke-linejoin="round"/>
<line x1="330" y1="885" x2="1100" y2="885" stroke="#B26B00" stroke-width="4"/>
<text x="1100" y="873" font-size="12" fill="#B26B00" text-anchor="end" font-weight="bold">LOGIC  5 V (USB)</text>
<rect x="400" y="960" width="300" height="130" fill="#ffffff" stroke="#B26B00" stroke-width="2.2" rx="6"/>
<rect x="400" y="960" width="300" height="40" fill="#B26B00" rx="6"/>
<rect x="400" y="992" width="300" height="8" fill="#B26B00"/>
<text x="550.0" y="980" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">PERC &#8212; Arduino 1</text>
<text x="550.0" y="994" font-size="10.5" fill="#D6E0EC" text-anchor="middle">own USB &#183; CH340</text>
<text x="416" y="1035" font-size="9.5" fill="#5A6472">+ HC-SR04P, PIR, SFM-27</text>
<circle cx="550" cy="885" r="4" fill="#B26B00"/>
<polyline points="550,885 550,960" fill="none" stroke="#B26B00" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="550" y1="1090" x2="550" y2="1090" stroke="#12305B" stroke-width="1.6"/>
<circle cx="550" cy="1090" r="3.2" fill="#12305B"/>
<rect x="760" y="960" width="300" height="130" fill="#ffffff" stroke="#B26B00" stroke-width="2.2" rx="6"/>
<rect x="760" y="960" width="300" height="40" fill="#B26B00" rx="6"/>
<rect x="760" y="992" width="300" height="8" fill="#B26B00"/>
<text x="910.0" y="980" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">ACT &#8212; Arduino 2</text>
<text x="910.0" y="994" font-size="10.5" fill="#D6E0EC" text-anchor="middle">own USB &#183; CH340</text>
<text x="776" y="1035" font-size="9.5" fill="#5A6472">+ 1602A LCD</text>
<circle cx="910" cy="885" r="4" fill="#B26B00"/>
<polyline points="910,885 910,960" fill="none" stroke="#B26B00" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="910" y1="1090" x2="910" y2="1090" stroke="#12305B" stroke-width="1.6"/>
<circle cx="910" cy="1090" r="3.2" fill="#12305B"/>
<line x1="420" y1="1090" x2="1220" y2="1090" stroke="#12305B" stroke-width="2.2"/>
<polyline points="1220,1090 1220,1140" fill="none" stroke="#12305B" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="1220" cy="1140" r="3.4" fill="#12305B"/>
<line x1="60" y1="1140" x2="1660" y2="1140" stroke="#12305B" stroke-width="5"/>
<text x="60" y="1126" font-size="13" fill="#12305B" font-weight="bold">STAR GROUND &#8212; EVERY NEGATIVE MEETS HERE</text>
<line x1="110" y1="280" x2="110" y2="1140" stroke="#12305B" stroke-width="2.2"/>
<circle cx="110" cy="1140" r="3.4" fill="#12305B"/>
<text x="116" y="302" font-size="8.5" fill="#12305B" font-weight="bold">traction −</text>
<line x1="170" y1="610" x2="170" y2="1140" stroke="#12305B" stroke-width="2.2"/>
<circle cx="170" cy="1140" r="3.4" fill="#12305B"/>
<text x="176" y="632" font-size="8.5" fill="#12305B" font-weight="bold">logic −</text>
<line x1="230" y1="940" x2="230" y2="1140" stroke="#12305B" stroke-width="2.2"/>
<circle cx="230" cy="1140" r="3.4" fill="#12305B"/>
<text x="236" y="962" font-size="8.5" fill="#12305B" font-weight="bold">USB −</text>
<rect x="1300" y="170" width="400" height="290" fill="#F4F7FA" stroke="#C3CEDC" stroke-width="1.2" rx="6"/>
<rect x="1300" y="170" width="4" height="290" fill="#B03A3E"/>
<text x="1318" y="195" font-size="13" fill="#B03A3E" font-weight="bold">WHY NOT THE 3.3 V PIN</text>
<text x="1318" y="221" font-size="10.5" fill="#12305B" font-weight="bold">What an Arduino 3.3 V pin gives</text>
<text x="1318" y="241" font-size="9.5" fill="#5A6472">Uno R3 (LP2985)</text>
<text x="1682" y="241" font-size="9.5" fill="#12305B" text-anchor="end" font-weight="bold">150 mA</text>
<text x="1318" y="258" font-size="9.5" fill="#5A6472">Nano (FT232RL)</text>
<text x="1682" y="258" font-size="9.5" fill="#12305B" text-anchor="end" font-weight="bold">50 mA</text>
<text x="1318" y="275" font-size="9.5" fill="#5A6472">CH340 clone</text>
<text x="1682" y="275" font-size="9.5" fill="#12305B" text-anchor="end" font-weight="bold">30 mA</text>
<line x1="1318" y1="301" x2="1682" y2="301" stroke="#C3CEDC" stroke-width="1"/>
<text x="1318" y="319" font-size="10.5" fill="#12305B" font-weight="bold">What an ESP32 needs</text>
<text x="1318" y="339" font-size="9.5" fill="#5A6472">idle</text>
<text x="1682" y="339" font-size="9.5" fill="#B03A3E" text-anchor="end" font-weight="bold">40 mA</text>
<text x="1318" y="356" font-size="9.5" fill="#5A6472">WiFi average</text>
<text x="1682" y="356" font-size="9.5" fill="#B03A3E" text-anchor="end" font-weight="bold">100 mA</text>
<text x="1318" y="373" font-size="9.5" fill="#5A6472">WiFi TX burst</text>
<text x="1682" y="373" font-size="9.5" fill="#B03A3E" text-anchor="end" font-weight="bold">500 mA</text>
<rect x="1300" y="500" width="400" height="290" fill="#F4F7FA" stroke="#C3CEDC" stroke-width="1.2" rx="6"/>
<rect x="1300" y="500" width="4" height="290" fill="#12305B"/>
<text x="1318" y="525" font-size="13" fill="#12305B" font-weight="bold">WHICH CELLS IN WHICH PACK</text>
<text x="1318" y="549" font-size="9.5" fill="#5A6472">LOGIC &#8594; 9 V. The MCX takes it through a</text>
<text x="1318" y="566" font-size="9.5" fill="#5A6472">buck module to 5 V at J3-10 &#8212; its own VIN</text>
<text x="1318" y="583" font-size="9.5" fill="#5A6472">pin is not wired to work. The ESP32 takes</text>
<text x="1318" y="617" font-size="9.5" fill="#5A6472">Do NOT use a PP3 block: ~500 mAh, and it sags</text>
<text x="1318" y="634" font-size="9.5" fill="#5A6472"></text>
<text x="1318" y="651" font-size="9.5" fill="#5A6472">TRACTION &#8594; either works now. The MG90S</text>
<text x="1318" y="668" font-size="9.5" fill="#5A6472">4.8&#8211;6.0 V window was what used to force NiMH</text>
<text x="1318" y="685" font-size="9.5" fill="#B03A3E" font-weight="bold">here; with the servos gone the TT motors are</text>
<text x="1318" y="702" font-size="9.5" fill="#5A6472">happy on 4.8 V or 6 V alike.</text>
<text x="1318" y="719" font-size="9.5" fill="#5A6472"></text>
<text x="1318" y="736" font-size="9.5" fill="#5A6472">NiMH is still the better choice: it holds its</text>
<text x="1318" y="753" font-size="9.5" fill="#5A6472">voltage under a stall where alkalines sag.</text>
<text x="1318" y="770" font-size="9.5" fill="#5A6472"></text>
<text x="1318" y="787" font-size="9.5" fill="#5A6472">Label the two packs. They are not swappable.</text>
<rect x="60" y="1420" width="1640" height="300" fill="#F4F7FA" stroke="#C3CEDC" stroke-width="1.2" rx="6"/>
<rect x="60" y="1420" width="4" height="300" fill="#12305B"/>
<text x="78" y="1445" font-size="13" fill="#12305B" font-weight="bold">SUPPLY WINDOWS &#8212; WHAT VIN CAN BE, PER BOARD</text>
<text x="82" y="1471" font-size="10.5" fill="#12305B" font-weight="bold">Board</text>
<text x="330" y="1471" font-size="10.5" fill="#12305B" font-weight="bold">Input</text>
<text x="610" y="1471" font-size="10.5" fill="#12305B" font-weight="bold">Absolute</text>
<text x="790" y="1471" font-size="10.5" fill="#12305B" font-weight="bold">Use</text>
<text x="930" y="1471" font-size="10.5" fill="#12305B" font-weight="bold">Why that ceiling</text>
<line x1="78" y1="1479" x2="1682" y2="1479" stroke="#C3CEDC" stroke-width="1"/>
<text x="82" y="1499" font-size="10" fill="#6B3FA0" font-weight="bold">FRDM-MCXA153</text>
<text x="330" y="1499" font-size="9.5" fill="#5A6472">J3-10  SYS_5V0</text>
<text x="610" y="1499" font-size="9.5" fill="#12305B" font-weight="bold">5 V &#177;5 %</text>
<text x="790" y="1499" font-size="9.5" fill="#6B3FA0" font-weight="bold">5.0 V</text>
<text x="330" y="1520" font-size="9.5" fill="#5A6472">J3-16  P5-9V_VIN</text>
<text x="610" y="1520" font-size="9.5" fill="#12305B" font-weight="bold">&#8212;</text>
<text x="790" y="1520" font-size="9.5" fill="#B03A3E" font-weight="bold">never</text>
<text x="330" y="1541" font-size="9.5" fill="#5A6472">MCU-Link USB</text>
<text x="610" y="1541" font-size="9.5" fill="#12305B" font-weight="bold">5 V</text>
<text x="790" y="1541" font-size="9.5" fill="#5A6472" font-weight="bold">5 V</text>
<text x="930" y="1541" font-size="9.5" fill="#5A6472">the only input that also gives you VCOM</text>
<text x="82" y="1562" font-size="10" fill="#0B7A75" font-weight="bold">Arduino Uno / Nano</text>
<text x="330" y="1562" font-size="9.5" fill="#5A6472">VIN pin or barrel</text>
<text x="610" y="1562" font-size="9.5" fill="#12305B" font-weight="bold">6 &#8211; 20 V</text>
<text x="790" y="1562" font-size="9.5" fill="#0B7A75" font-weight="bold">7 &#8211; 9 V</text>
<text x="930" y="1562" font-size="9.5" fill="#5A6472">below 7 V the 5 V rail sags on dropout</text>
<text x="330" y="1583" font-size="9.5" fill="#5A6472">5V pin</text>
<text x="610" y="1583" font-size="9.5" fill="#12305B" font-weight="bold">4.8 &#8211; 5.2 V</text>
<text x="790" y="1583" font-size="9.5" fill="#5A6472" font-weight="bold">5.0 V</text>
<text x="930" y="1583" font-size="9.5" fill="#5A6472">bypasses the regulator &#8212; never with USB too</text>
<text x="330" y="1604" font-size="9.5" fill="#5A6472">USB</text>
<text x="610" y="1604" font-size="9.5" fill="#12305B" font-weight="bold">5 V</text>
<text x="790" y="1604" font-size="9.5" fill="#5A6472" font-weight="bold">5 V</text>
<text x="930" y="1604" font-size="9.5" fill="#5A6472">what this design uses</text>
<text x="82" y="1625" font-size="10" fill="#B03A3E" font-weight="bold">ESP32 DevKit</text>
<text x="330" y="1625" font-size="9.5" fill="#5A6472">VIN / 5V pin</text>
<text x="610" y="1625" font-size="9.5" fill="#12305B" font-weight="bold">4.75 &#8211; 12 V</text>
<text x="790" y="1625" font-size="9.5" fill="#B03A3E" font-weight="bold">5 &#8211; 6 V</text>
<text x="330" y="1646" font-size="9.5" fill="#5A6472">3V3 pin</text>
<text x="610" y="1646" font-size="9.5" fill="#12305B" font-weight="bold">3.0 &#8211; 3.6 V</text>
<text x="790" y="1646" font-size="9.5" fill="#5A6472" font-weight="bold">3.3 V</text>
<text x="930" y="1646" font-size="9.5" fill="#5A6472">bypasses AMS1117 &#8212; needs a solid 500 mA</text>
<text x="330" y="1667" font-size="9.5" fill="#5A6472">micro-USB</text>
<text x="610" y="1667" font-size="9.5" fill="#12305B" font-weight="bold">5 V</text>
<text x="790" y="1667" font-size="9.5" fill="#5A6472" font-weight="bold">5 V</text>
<text x="930" y="1667" font-size="9.5" fill="#5A6472">fine, but then it is a fourth cable</text>
<line x1="78" y1="1695" x2="1682" y2="1695" stroke="#C3CEDC" stroke-width="1"/>
</svg>
