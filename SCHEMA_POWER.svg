<rect x="760" y="332" width="300" height="8" fill="#B03A3E"/>
<text x="910.0" y="320" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">nothing else</text>
<text x="910.0" y="334" font-size="10.5" fill="#D6E0EC" text-anchor="middle">the motors are the only load</text>
