<text x="550.0" y="334" font-size="10.5" fill="#D6E0EC" text-anchor="middle">each via its own PN2222A</text>
<circle cx="550" cy="225" r="4" fill="#B03A3E"/>
<polyline points="550,225 550,300" fill="none" stroke="#B03A3E" stroke-width="2.6" stroke-linejoin="round"/>
